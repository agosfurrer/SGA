<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SGA Docentes</title>
        <link rel="stylesheet" href="CSS/estilos.css">
        <script src="JS/storage.js" defer></script>
        <script src="JS/ui.js" defer></script>
         <script src="JS/docentes.js" defer></script>
    </head>
    <body>
        <header>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="alumnos.html">Alumnos</a>
                <a href="docentes.html">Docentes</a>
            </nav>
        </header>
        <main>
            <h1>Gestión de Docentes</h1>
            <section class="formulario-container">
                <h2>Alta de docente</h2>
                <form id="formDocente">

                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre">
                    </div>

                    <div class="campo">
                        <label for="especialidad">Especialidad</label>
                        <input type="text" id="especialidad">
                    </div>

                    <div class="campo">
                        <label for="correo">Correo Electrónico</label>
                        <input type="email" id="correo">
                    </div>

                    <button type="submit">Guardar docente</button>

                </form>
              
            </section>
            <section class="lista-container">

                <h2>Docentes registrados</h2>
                <p id="cantidadDocentes"></p>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Especialidad</th>
                            <th>Correo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaDocentes"></tbody>
                </table>
            </section>
            <div id="mensaje" class="mensaje"></div>
        </main>

       
    </body>
</html>
